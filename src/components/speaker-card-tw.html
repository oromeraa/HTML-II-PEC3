<div
  class="card-speaker w-full max-w-card-max flex-col @cqmedium:w-auto @cqmedium:grow @cqmedium:basis-card @cqmedium:flex-row"
>
  <img
    src="{{ photo }}"
    alt="Foto de {{ name }}"
    class="aspect-square w-full shrink-0 object-cover @cqmedium:aspect-auto @cqmedium:w-1/2"
  />
  <div class="flex flex-col items-start gap-2 p-4">
    <h2 class="m-0 text-xl font-bold">{{ name }}</h2>
    <p class="m-0 text-sabero-black/70">{{ bio }}</p>
    <span class="badge-field">{{ field }}</span>
  </div>
</div>
