<div
  class="card-sabero w-full max-w-sm grow basis-72 @min-[900px]:max-w-none @min-[900px]:basis-[calc(50%-0.75rem)] @min-[900px]:flex-row"
>
  <img
    src="{{ photo }}"
    alt="Foto de {{ name }}"
    class="aspect-square w-full object-cover @min-[900px]:w-1/2"
  />
  <div class="flex flex-col items-start gap-2 p-4">
    <h2 class="m-0 text-xl font-bold">{{ name }}</h2>
    <p class="m-0 text-sabero-black/70">{{ bio }}</p>
    <span class="badge-field">{{ field }}</span>
  </div>
</div>
